<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Register | Peace Freedom</title>
</head>
<body>
    <main class="login-card">
        <p class="brand-name">Peace Freedom International Collective</p>
        <h1>Create account</h1>
        <p class="subtitle">Fill in your details to get started</p>

        <form action="LoginForm.html">
            <label for="first-name">First name</label>
            <input id="first-name" name="firstName" type="text" required>

            <label for="last-name">Last name</label>
            <input id="last-name" name="lastName" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="register-password">Password</label>
            <input id="register-password" name="password" type="password"
                minlength="4" autocomplete="new-password" required>

            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" required>

            <button type="submit">Create Account</button>
            <a class="secondary-button" href="LoginForm.html">Back to Login</a>
        </form>
    </main>
</body>
</html>
