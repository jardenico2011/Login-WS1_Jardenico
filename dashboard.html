<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <h1>Dashboard</h1>
            <a href="index.html" class="logout">Logout</a>
        </header>

        <section class="stats">
            <div class="stat-card">
                <p>Total Users</p>
                <strong>1,234</strong>
            </div>
            <div class="stat-card">
                <p>Total Orders</p>
                <strong>567</strong>
            </div>
            <div class="stat-card">
                <p>Total Revenue</p>
                <strong>$98,765</strong>
            </div>
        </section>

        <section class="activity">
            <div class="activity-card">
                <h2>Recent Activity</h2>
                <ul class="activity-list">
                    <li>
                        <span>New user registered</span>
                        <time datetime="2023-10-01T10:00:00Z">10:00 AM</time>
                    </li>
                    <li>
                        <span>Order placed</span>
                        <time datetime="2023-10-01T09:30:00Z">9:30 AM</time>
                    </li>
                    <!-- Add more activity items as needed -->
                </ul>
            </div>
        </section>
    </main>
</body>
</html>
